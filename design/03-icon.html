<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Paper X-Ray 图标</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans','Noto Sans SC',system-ui,sans-serif;background:#EDEDED}
a{color:#40628C}a:hover{color:#2E4766}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0;}</style>
</head>
<body>
<div style="width: 880px; height: 560px; box-sizing: border-box; padding: 44px; display: flex; gap: 40px; background: #EDEDED; color: #1A1A1A;">

  <div style="display: flex; flex-direction: column; gap: 20px; flex-shrink: 0;">
    <svg width="196" height="196" viewBox="0 0 100 100" role="img" aria-label="Paper X-Ray 图标">
      <rect width="100" height="100" rx="22" fill="#1A1A1A"></rect>
      <rect x="20" y="17" width="45" height="66" rx="2" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-width="1.8"></rect>
      <rect x="27" y="28" width="31" height="2.6" fill="#FFFFFF" fill-opacity="0.38"></rect>
      <rect x="27" y="38" width="24" height="2.6" fill="#FFFFFF" fill-opacity="0.38"></rect>
      <rect x="27" y="48" width="29" height="5" fill="#D4A017" fill-opacity="0.85"></rect>
      <rect x="27" y="62" width="20" height="2.6" fill="#FFFFFF" fill-opacity="0.38"></rect>
      <rect x="27" y="70" width="27" height="2.6" fill="#FFFFFF" fill-opacity="0.38"></rect>
      <rect x="71" y="22" width="8" height="14" fill="#D4A017"></rect>
      <rect x="71" y="42" width="8" height="20" fill="#7FA3CC"></rect>
      <rect x="71" y="68" width="8" height="8" fill="#D4A017" fill-opacity="0.45"></rect>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 27px; font-weight: 600; letter-spacing: -0.015em; white-space: nowrap;">Paper X-Ray</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6B6B6B; letter-spacing: 0.2em;">论文透视</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 26px; min-width: 0;">

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.18em; color: #6B6B6B;">SIZES</div>
      <div style="display: flex; align-items: flex-end; gap: 24px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <svg width="64" height="64" viewBox="0 0 100 100" role="img" aria-label="64 像素图标">
            <rect width="100" height="100" rx="22" fill="#1A1A1A"></rect>
            <rect x="20" y="17" width="45" height="66" rx="2" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-width="2.4"></rect>
            <rect x="27" y="30" width="31" height="3.4" fill="#FFFFFF" fill-opacity="0.38"></rect>
            <rect x="27" y="47" width="29" height="6" fill="#D4A017" fill-opacity="0.85"></rect>
            <rect x="27" y="64" width="24" height="3.4" fill="#FFFFFF" fill-opacity="0.38"></rect>
            <rect x="71" y="22" width="8" height="14" fill="#D4A017"></rect>
            <rect x="71" y="42" width="8" height="20" fill="#7FA3CC"></rect>
            <rect x="71" y="68" width="8" height="8" fill="#D4A017" fill-opacity="0.45"></rect>
          </svg>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6B6B6B;">64</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <svg width="40" height="40" viewBox="0 0 100 100" role="img" aria-label="40 像素图标">
            <rect width="100" height="100" rx="22" fill="#1A1A1A"></rect>
            <rect x="20" y="17" width="45" height="66" rx="2" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-width="3"></rect>
            <rect x="28" y="32" width="29" height="4" fill="#FFFFFF" fill-opacity="0.38"></rect>
            <rect x="28" y="47" width="29" height="7" fill="#D4A017" fill-opacity="0.9"></rect>
            <rect x="28" y="64" width="22" height="4" fill="#FFFFFF" fill-opacity="0.38"></rect>
            <rect x="71" y="22" width="8" height="15" fill="#D4A017"></rect>
            <rect x="71" y="44" width="8" height="21" fill="#7FA3CC"></rect>
          </svg>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6B6B6B;">40</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <svg width="24" height="24" viewBox="0 0 100 100" role="img" aria-label="24 像素图标">
            <rect width="100" height="100" rx="22" fill="#1A1A1A"></rect>
            <rect x="20" y="17" width="45" height="66" rx="2" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-width="5"></rect>
            <rect x="28" y="45" width="29" height="10" fill="#D4A017"></rect>
            <rect x="70" y="24" width="10" height="20" fill="#D4A017"></rect>
            <rect x="70" y="52" width="10" height="24" fill="#7FA3CC"></rect>
          </svg>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6B6B6B;">24</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.18em; color: #6B6B6B;">VARIANTS</div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <div style="width: 100px; height: 100px; background: #FFFFFF; border: 1px solid #DBDBDB; border-radius: 6px; display: flex; align-items: center; justify-content: center;">
          <svg width="60" height="60" viewBox="0 0 100 100" role="img" aria-label="浅色底图标">
            <rect width="100" height="100" rx="22" fill="#1A1A1A"></rect>
            <rect x="20" y="17" width="45" height="66" rx="2" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-width="2.4"></rect>
            <rect x="27" y="47" width="29" height="6" fill="#D4A017" fill-opacity="0.9"></rect>
            <rect x="71" y="22" width="8" height="14" fill="#D4A017"></rect>
            <rect x="71" y="42" width="8" height="20" fill="#7FA3CC"></rect>
          </svg>
        </div>
        <div style="width: 100px; height: 100px; background: #FFFFFF; border: 1px solid #DBDBDB; border-radius: 6px; display: flex; align-items: center; justify-content: center;">
          <svg width="60" height="60" viewBox="0 0 100 100" role="img" aria-label="单色描边图标">
            <rect x="8" y="8" width="84" height="84" rx="18" fill="none" stroke="#1A1A1A" stroke-width="4"></rect>
            <rect x="24" y="24" width="36" height="52" fill="none" stroke="#1A1A1A" stroke-width="4"></rect>
            <rect x="70" y="28" width="7" height="14" fill="#1A1A1A"></rect>
            <rect x="70" y="48" width="7" height="20" fill="#1A1A1A"></rect>
          </svg>
        </div>
        <div style="width: 100px; height: 100px; background: #D4A017; border-radius: 6px; display: flex; align-items: center; justify-content: center;">
          <svg width="60" height="60" viewBox="0 0 100 100" role="img" aria-label="强调色底图标">
            <rect x="20" y="17" width="45" height="66" rx="2" fill="#1A1A1A" fill-opacity="0.18" stroke="#1A1A1A" stroke-width="3"></rect>
            <rect x="27" y="47" width="29" height="6" fill="#1A1A1A"></rect>
            <rect x="71" y="22" width="8" height="14" fill="#1A1A1A"></rect>
            <rect x="71" y="42" width="8" height="20" fill="#1A1A1A" fill-opacity="0.5"></rect>
          </svg>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.18em; color: #6B6B6B;">MARKER SEMANTICS</div>
      <div style="display: flex; gap: 20px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="width: 9px; height: 22px; background: #D4A017; display: inline-block;"></span>
          <span style="font-size: 12px; color: #3C3C3C;">agent 标注</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="width: 9px; height: 22px; background: #40628C; display: inline-block;"></span>
          <span style="font-size: 12px; color: #3C3C3C;">人类标注</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="width: 9px; height: 22px; background: #CFCFCF; display: inline-block;"></span>
          <span style="font-size: 12px; color: #3C3C3C;">未标注正文</span>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
